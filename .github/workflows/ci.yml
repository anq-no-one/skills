name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
      - run: shellcheck scripts/*.sh skills/tandem/scripts/*.sh
      - run: scripts/check-skills.sh
      - run: bats skills/tandem/tests
